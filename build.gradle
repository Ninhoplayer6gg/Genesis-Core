plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.genesis'
version = '0.1.0'
base { archivesName = 'genesis-core-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods { genesis { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'genesis' }
    }
}

repositories {
    maven { url = 'https://libraries.minecraft.net/'; content { includeGroup 'com.mojang' } }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.threetag.net'; content { includeGroup 'net.threetag' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } }
    maven { url = 'https://maven.kosmx.dev/'; content { includeGroup 'dev.kosmx.player-anim' } }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
    implementation(fg.deobf('net.threetag:palladium-forge:4.5.4+1.20.1:forge@jar')) { transitive = false }
    implementation(fg.deobf('net.threetag:palladiumcore-forge:1.0.1+1.20.1:forge@jar')) { transitive = false }
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.4')
    runtimeOnly fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
jar {
    manifest.attributes('Implementation-Title': 'Genesis Core', 'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}
